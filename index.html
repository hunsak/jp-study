<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>原稿帳 · 일본어 학습 기록</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F4858">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#EDE8DA;
    --washi-card:#F8F5EC;
    --sumi:#232B2F;
    --sumi-soft:#5B6469;
    --ai:#2F4858;
    --ai-light:#6D8A99;
    --ai-pale:#DCE5E8;
    --shu:#B33A3A;
    --grid-line:#C9C2AC;
    --line:#DAD3C0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--washi);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment:fixed;
    color:var(--sumi);
    font-family:'Noto Sans KR',sans-serif;
    padding-bottom:96px;
    min-height:100vh;
  }
  .display{font-family:'Shippori Mincho B1',serif;}
  header{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  header .kanji-title{
    font-family:'Shippori Mincho B1',serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:.14em;
    color:var(--ai);
    margin:0;
  }
  header .sub{
    margin-top:4px;
    font-size:12.5px;
    color:var(--sumi-soft);
    letter-spacing:.04em;
  }
  .hanko{
    position:absolute;
    top:20px; right:18px;
    width:44px;height:44px;
    border:2px solid var(--shu);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--shu);
    font-family:'Shippori Mincho B1',serif;
    font-weight:700;
    font-size:11px;
    line-height:1.15;
    text-align:center;
    transform:rotate(-4deg);
    opacity:.9;
    cursor:pointer;
    background:rgba(179,58,58,0.04);
  }
  .tabs{
    display:flex;
    margin:0 16px 14px;
    background:var(--washi-card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:11px 0;
    font-size:14px;
    font-weight:600;
    color:var(--sumi-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{
    color:var(--ai);
    background:var(--ai-pale);
    border-bottom:2px solid var(--ai);
  }
  main{padding:0 16px;}
  .empty{
    text-align:center;
    color:var(--sumi-soft);
    font-size:13.5px;
    padding:40px 20px;
    border:1px dashed var(--grid-line);
    border-radius:10px;
    background:var(--washi-card);
  }
  .card{
    background:var(--washi-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 1px 0 rgba(35,43,47,0.03);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .card-title{
    font-family:'Shippori Mincho B1',serif;
    font-weight:700;
    font-size:17px;
    color:var(--sumi);
  }
  .badge{
    font-size:10.5px;
    padding:2px 8px;
    border-radius:20px;
    background:var(--ai-pale);
    color:var(--ai);
    font-weight:600;
    white-space:nowrap;
    margin-top:2px;
    display:inline-block;
  }
  .percent{
    font-family:'Shippori Mincho B1',serif;
    font-size:22px;
    font-weight:800;
    color:var(--ai);
    min-width:56px;
    text-align:right;
  }
  .unit-line{
    font-size:12px;
    color:var(--sumi-soft);
    margin-top:2px;
  }
  .grid-meter{
    display:grid;
    grid-template-columns:repeat(20,1fr);
    gap:3px;
    margin-top:12px;
  }
  .cell{
    aspect-ratio:1;
    border:1px solid var(--grid-line);
    border-radius:2px;
    background:transparent;
    position:relative;
  }
  .cell.filled{
    background:var(--ai);
    border-color:var(--ai);
  }
  .cell.milestone.filled::after{
    content:'';
    position:absolute;inset:3px;
    border-radius:1px;
    background:var(--shu);
    opacity:.55;
  }
  .card-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }
  .last-touch{
    font-size:11.5px;
    color:var(--sumi-soft);
  }
  .btn{
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .btn-primary{background:var(--ai);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ai);border:1px solid var(--ai-light);}
  .btn-shu{background:var(--shu);color:#fff;}
  .fab{
    position:fixed;
    bottom:22px; right:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--ai);
    color:#fff;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(47,72,88,0.35);
    border:none;
    cursor:pointer;
    z-index:10;
  }
  .streak-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-top:2px;
  }
  .streak-num{
    font-family:'Shippori Mincho B1',serif;
    font-size:22px;
    font-weight:800;
    color:var(--shu);
  }
  .streak-label{
    font-size:11.5px;
    color:var(--sumi-soft);
  }
  .check-grid{
    display:grid;
    grid-template-columns:repeat(14,1fr);
    gap:3px;
    margin-top:12px;
  }
  .check-cell{
    aspect-ratio:1;
    border:1px solid var(--grid-line);
    border-radius:2px;
    background:transparent;
    position:relative;
  }
  .check-cell.done{
    background:var(--shu);
    border-color:var(--shu);
  }
  .check-cell.today{
    box-shadow:0 0 0 2px var(--ai) inset;
  }
  .btn-check{
    background:var(--ai);
    color:#fff;
  }
  .btn-check.checked{
    background:var(--shu);
  }
  .completed-wrap{
    margin:16px 0 4px;
  }
  .completed-title{
    font-family:'Shippori Mincho B1',serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--sumi-soft);
    margin-bottom:8px;
  }
  .completed-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--washi-card);
    border:1px solid var(--line);
    border-left:3px solid var(--shu);
    border-radius:8px;
    padding:11px 13px;
    margin-bottom:8px;
  }
  .completed-name{
    font-size:13.5px;
    font-weight:600;
    color:var(--sumi);
  }
  .completed-date{
    font-size:11px;
    color:var(--sumi-soft);
    margin-top:2px;
  }
  .completed-badge{
    font-size:11px;
    font-weight:700;
    color:var(--shu);
    white-space:nowrap;
    margin-right:10px;
  }
  .log-toggle{
    display:flex;
    gap:8px;
    margin:16px 0 12px;
  }
  .log-toggle-btn{
    font-size:12.5px;
    font-weight:600;
    color:var(--sumi-soft);
    background:var(--washi-card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    cursor:pointer;
  }
  .log-toggle-btn.active{
    color:#fff;
    background:var(--ai);
    border-color:var(--ai);
  }
  .material-chip-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:14px 0 16px;
  }
  .material-chip{
    padding:8px 13px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--washi-card);
    font-size:13px;
    font-weight:600;
    color:var(--sumi);
    cursor:pointer;
  }
  .material-chip .cnt{
    opacity:.65;
    font-weight:500;
    margin-left:2px;
  }
  .material-chip.active{
    background:var(--ai);
    color:#fff;
    border-color:var(--ai);
  }
  .log-item{
    background:var(--washi-card);
    border:1px solid var(--line);
    border-left:3px solid var(--ai);
    border-radius:8px;
    padding:11px 13px;
    margin-bottom:9px;
  }
  .log-date{
    font-size:11px;
    color:var(--sumi-soft);
    font-weight:600;
  }
  .log-body{
    font-size:13.5px;
    margin-top:3px;
  }
  .log-body b{color:var(--ai);}
  .log-note{
    font-size:12.5px;
    color:var(--sumi-soft);
    margin-top:4px;
    font-style:italic;
  }
  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(35,43,47,0.45);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--washi-card);
    width:100%;
    border-radius:16px 16px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .sheet h3{
    font-family:'Shippori Mincho B1',serif;
    margin:0 0 14px;
    font-size:18px;
    color:var(--ai);
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--sumi-soft);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--grid-line);
    border-radius:8px;
    font-size:16px;
    background:#fff;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--sumi);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .row2{display:flex;flex-wrap:wrap;gap:10px;}
  .row2 .field{flex:1 1 130px;min-width:0;}
  .field input[type="date"]{
    -webkit-appearance:none;
    appearance:none;
    min-width:0;
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    display:block;
  }
  .sheet-actions{
    display:flex;gap:10px;margin-top:16px;
  }
  .sheet-actions .btn{flex:1;padding:12px 0;}
  .sync-status{
    text-align:center;
    font-size:11.5px;
    color:var(--sumi-soft);
    padding:6px 0 2px;
  }
  .danger-link{
    color:var(--shu);
    font-size:12px;
    text-align:center;
    display:block;
    margin-top:14px;
    cursor:pointer;
    text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <div class="hanko" id="hankoBtn">設定<br>settings</div>
  <p class="kanji-title">原稿帳</p>
  <p class="sub">일본어 학습 기록 · JLPT N3</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="materials">교재 진도</div>
  <div class="tab" data-tab="logs">기록</div>
</div>

<main>
  <div id="view-materials"></div>
  <div id="view-logs" style="display:none;">
    <div class="log-toggle" id="logToggle">
      <span class="log-toggle-btn active" data-mode="date">날짜순</span>
      <span class="log-toggle-btn" data-mode="material">교재별</span>
      <span class="log-toggle-btn" data-mode="completed">완료한 교재</span>
    </div>
    <div id="completedSection" style="display:none;"></div>
    <div id="logListWrap"></div>
  </div>
</main>

<button class="fab" id="fabBtn">＋</button>

<!-- 교재 추가 모달 -->
<div class="overlay" id="overlayMaterial">
  <div class="sheet">
    <h3 id="materialSheetTitle">教材追加 · 교재 등록</h3>
    <div class="field">
      <label>이름</label>
      <input type="text" id="mName" placeholder="예: 다이스키 일본어 N3, Duolingo">
    </div>
    <div class="row2">
      <div class="field">
        <label>유형</label>
        <select id="mType">
          <option value="책">책 · 교재</option>
          <option value="앱">앱</option>
          <option value="강의">강의</option>
        </select>
      </div>
      <div class="field">
        <label>추적 방식</label>
        <select id="mTrackMode" onchange="toggleTrackModeFields()">
          <option value="progress">진도율 (분량 기준)</option>
          <option value="check">매일 체크 (했다/안했다)</option>
        </select>
      </div>
    </div>
    <div id="progressFields">
      <div class="row2">
        <div class="field">
          <label>단위</label>
          <input type="text" id="mUnitLabel" placeholder="페이지 / 과 / 챕터" value="페이지">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>전체 분량</label>
          <input type="number" id="mTotal" placeholder="예: 320" min="1">
        </div>
        <div class="field">
          <label>현재까지 진도</label>
          <input type="number" id="mCurrent" placeholder="0" value="0" min="0">
        </div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="editingMaterialId=null;closeSheet('overlayMaterial')">취소</button>
      <button class="btn btn-primary" onclick="saveMaterial()" id="materialSaveBtn">등록</button>
    </div>
    <span class="danger-link" id="materialDeleteLink" style="display:none;" onclick="deleteMaterial()">이 교재 삭제 (기록도 함께 삭제됨)</span>
  </div>
</div>

<!-- 기록 추가 모달 -->
<div class="overlay" id="overlayLog">
  <div class="sheet">
    <h3>記録 · 오늘 공부 기록</h3>
    <div class="field">
      <label>교재</label>
      <select id="lMaterial"></select>
    </div>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="lDate">
    </div>
    <div class="field" id="lToUnitField">
      <label>진도 (여기까지)</label>
      <input type="number" id="lToUnit" min="0">
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="lNote" placeholder="오늘 공부한 내용, 헷갈렸던 문법 등"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet('overlayLog')">취소</button>
      <button class="btn btn-shu" onclick="saveLog()">기록하기</button>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="overlay" id="overlaySettings">
  <div class="sheet">
    <h3>設定 · GitHub 동기화 설정</h3>
    <div class="field">
      <label>GitHub 사용자명</label>
      <input type="text" id="sOwner" placeholder="hunsak">
    </div>
    <div class="field">
      <label>저장소 이름</label>
      <input type="text" id="sRepo" placeholder="jp-study">
    </div>
    <div class="field">
      <label>데이터 파일 경로</label>
      <input type="text" id="sPath" placeholder="data.json" value="data.json">
    </div>
    <div class="field">
      <label>Personal Access Token (이 기기에만 저장됨)</label>
      <input type="password" id="sToken" placeholder="ghp_...">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet('overlaySettings')">닫기</button>
      <button class="btn btn-primary" onclick="saveSettings()">저장 &amp; 동기화</button>
    </div>
    <div class="sync-status" id="syncStatus"></div>
    <span class="danger-link" onclick="resetAll()">이 기기의 설정/데이터 초기화</span>
  </div>
</div>

<script>
// ---------- 상태 ----------
let data = { materials: [], logs: [] };
let sha = null;
let settings = JSON.parse(localStorage.getItem('jpStudySettings') || 'null');
let editingMaterialId = null;
let logViewMode = 'date';
let logMaterialFilter = null;

const MILESTONES = [4,9,14,19]; // 20칸 그리드에서 25/50/75/100% 표시용 index

// ---------- 초기화 ----------
document.getElementById('lDate').value = localDateStr(new Date());

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const target = t.dataset.tab;
    document.getElementById('view-materials').style.display = target==='materials' ? '' : 'none';
    document.getElementById('view-logs').style.display = target==='logs' ? '' : 'none';
  });
});

document.getElementById('hankoBtn').addEventListener('click', ()=>{
  if(settings){
    document.getElementById('sOwner').value = settings.owner || '';
    document.getElementById('sRepo').value = settings.repo || '';
    document.getElementById('sPath').value = settings.path || 'data.json';
    document.getElementById('sToken').value = settings.token || '';
  }
  openSheet('overlaySettings');
});

document.getElementById('fabBtn').addEventListener('click', ()=>{
  const activeTab = document.querySelector('.tab.active').dataset.tab;
  if(activeTab === 'materials'){
    editingMaterialId = null;
    document.getElementById('materialSheetTitle').textContent = '教材追加 · 교재 등록';
    document.getElementById('materialSaveBtn').textContent = '등록';
    document.getElementById('materialDeleteLink').style.display = 'none';
    document.getElementById('mName').value='';
    document.getElementById('mType').value='책';
    document.getElementById('mTrackMode').value='progress';
    document.getElementById('mUnitLabel').value='페이지';
    document.getElementById('mTotal').value='';
    document.getElementById('mCurrent').value='0';
    toggleTrackModeFields();
    openSheet('overlayMaterial');
  } else {
    if(data.materials.length===0){
      alert('먼저 교재를 등록해주세요.');
      return;
    }
    const sel = document.getElementById('lMaterial');
    sel.innerHTML = data.materials.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
    document.getElementById('lDate').value = localDateStr(new Date());
    document.getElementById('lNote').value='';
    updateLogDefaultUnit();
    openSheet('overlayLog');
  }
});

document.getElementById('lMaterial').addEventListener('change', updateLogDefaultUnit);
document.querySelectorAll('.log-toggle-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.log-toggle-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    logViewMode = btn.dataset.mode;
    renderLogs();
  });
});
function updateLogDefaultUnit(){
  const m = data.materials.find(x=>x.id===document.getElementById('lMaterial').value);
  const isCheck = m && m.trackMode==='check';
  document.getElementById('lToUnitField').style.display = isCheck ? 'none' : '';
  document.getElementById('lToUnit').value = (m && !isCheck) ? m.currentUnit : 0;
}

function openSheet(id){ document.getElementById(id).classList.add('show'); }
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }

function toggleTrackModeFields(){
  const mode = document.getElementById('mTrackMode').value;
  document.getElementById('progressFields').style.display = mode==='check' ? 'none' : '';
}

// ---------- 렌더링 ----------
function render(){
  renderMaterials();
  renderCompletedSection();
  renderLogs();
}

function isMaterialComplete(m){
  return m.trackMode !== 'check' && m.totalUnits>0 && m.currentUnit >= m.totalUnits;
}

function renderCompletedSection(){
  const el = document.getElementById('completedSection');
  if(!el) return;
  const completed = data.materials.filter(isMaterialComplete);
  if(completed.length===0){
    el.innerHTML = `<div class="empty">아직 완료한 교재가 없어요.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="completed-wrap">
      ${completed.map(m=>{
        const lastLog = data.logs.filter(l=>l.materialId===m.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
        const dateTxt = lastLog ? `${formatDate(lastLog.date)} 완료` : '완료';
        return `
          <div class="completed-card" onclick="editMaterial('${m.id}')">
            <div>
              <div class="completed-name">${escapeHtml(m.name)}</div>
              <div class="completed-date">${dateTxt} · ${m.totalUnits} ${escapeHtml(m.unitLabel||'')}</div>
            </div>
            <span class="completed-badge">100% ✓</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderMaterials(){
  const el = document.getElementById('view-materials');
  const active = data.materials.filter(m=>!isMaterialComplete(m));
  if(active.length===0){
    if(data.materials.length>0){
      el.innerHTML = `<div class="empty">진행 중인 교재가 없어요.<br>완료한 교재는 '기록' 탭에서 볼 수 있어요.</div>`;
    } else {
      el.innerHTML = `<div class="empty">아직 등록된 교재가 없어요.<br>오른쪽 아래 ＋ 버튼으로 첫 교재를 등록해보세요.</div>`;
    }
    return;
  }
  el.innerHTML = active.map(m=>{
    return m.trackMode === 'check' ? checkCardHtml(m) : progressCardHtml(m);
  }).join('');
}

function progressCardHtml(m){
  const pct = m.totalUnits>0 ? Math.min(100, Math.round((m.currentUnit/m.totalUnits)*100)) : 0;
  const filledCells = Math.round(pct/5);
  let cells = '';
  for(let i=0;i<20;i++){
    const filled = i < filledCells;
    const isMilestone = MILESTONES.includes(i);
    cells += `<div class="cell ${filled?'filled':''} ${isMilestone?'milestone':''}"></div>`;
  }
  const lastLog = data.logs.filter(l=>l.materialId===m.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastTxt = lastLog ? `마지막 기록 ${daysAgoText(lastLog.date)}` : '아직 기록 없음';
  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(m.name)}</div>
          <span class="badge">${escapeHtml(m.type)}</span>
        </div>
        <div class="percent">${pct}%</div>
      </div>
      <div class="unit-line">${m.currentUnit} / ${m.totalUnits} ${escapeHtml(m.unitLabel)}</div>
      <div class="grid-meter">${cells}</div>
      <div class="card-foot">
        <span class="last-touch">${lastTxt}</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" onclick="editMaterial('${m.id}')">수정</button>
          <button class="btn btn-primary" onclick="quickLog('${m.id}')">기록</button>
        </div>
      </div>
    </div>
  `;
}

function checkCardHtml(m){
  const checkedDates = new Set(data.logs.filter(l=>l.materialId===m.id).map(l=>l.date));
  const streak = calcStreak(checkedDates);
  const todayStr = localDateStr(new Date());
  const isCheckedToday = checkedDates.has(todayStr);

  // 최근 14일 (오늘 포함, 왼쪽이 과거)
  let cells = '';
  for(let i=13;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const dStr = localDateStr(d);
    const done = checkedDates.has(dStr);
    const isToday = dStr===todayStr;
    cells += `<div class="check-cell ${done?'done':''} ${isToday?'today':''}"></div>`;
  }

  const lastLog = data.logs.filter(l=>l.materialId===m.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastTxt = lastLog ? `마지막 체크 ${daysAgoText(lastLog.date)}` : '아직 체크 없음';

  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(m.name)}</div>
          <span class="badge">${escapeHtml(m.type)}</span>
        </div>
        <div class="streak-row">
          <span class="streak-num">${streak}</span>
          <span class="streak-label">일 연속</span>
        </div>
      </div>
      <div class="check-grid">${cells}</div>
      <div class="card-foot">
        <span class="last-touch">${lastTxt}</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" onclick="editMaterial('${m.id}')">수정</button>
          <button class="btn btn-check ${isCheckedToday?'checked':''}" onclick="toggleTodayCheck('${m.id}')">${isCheckedToday?'오늘 완료 ✓':'오늘 체크'}</button>
        </div>
      </div>
    </div>
  `;
}

function calcStreak(checkedDatesSet){
  let streak = 0;
  const d = new Date();
  // 오늘 체크 안 했으면 어제부터 세기 시작 (오늘 아직 안 해서 스트릭 끊긴 걸로 보이지 않게)
  if(!checkedDatesSet.has(localDateStr(d))){
    d.setDate(d.getDate()-1);
  }
  while(checkedDatesSet.has(localDateStr(d))){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function toggleTodayCheck(materialId){
  const todayStr = localDateStr(new Date());
  const existing = data.logs.find(l=>l.materialId===materialId && l.date===todayStr);
  if(existing){
    data.logs = data.logs.filter(l=>l!==existing);
  } else {
    data.logs.push({ id:'l_'+Date.now(), materialId, date: todayStr, fromUnit:0, toUnit:1, note:'' });
  }
  render();
  syncToGitHub();
}

function renderLogs(){
  const logListEl = document.getElementById('logListWrap');
  const completedEl = document.getElementById('completedSection');

  if(logViewMode === 'completed'){
    logListEl.style.display = 'none';
    completedEl.style.display = '';
    renderCompletedSection();
    return;
  }
  logListEl.style.display = '';
  completedEl.style.display = 'none';

  if(data.logs.length===0){
    logListEl.innerHTML = `<div class="empty">기록이 아직 없어요.<br>교재 진도를 등록하면 여기 쌓여요.</div>`;
    return;
  }
  if(logViewMode === 'material'){
    renderLogsByMaterial(logListEl);
  } else {
    renderLogsByDate(logListEl);
  }
}

function renderLogsByDate(el){
  const sorted = [...data.logs].sort((a,b)=>b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  el.innerHTML = sorted.map(l=> logItemHtml(l)).join('');
}

function renderLogsByMaterial(el){
  const matsWithLogs = data.materials.filter(m=> data.logs.some(l=>l.materialId===m.id));
  const orphanedLogs = data.logs.filter(l=>!data.materials.find(m=>m.id===l.materialId));
  if(matsWithLogs.length===0 && orphanedLogs.length===0){
    el.innerHTML = `<div class="empty">기록이 없어요.</div>`;
    return;
  }
  const validFilterIds = matsWithLogs.map(m=>m.id).concat(orphanedLogs.length>0 ? ['__orphaned__'] : []);
  if(!logMaterialFilter || !validFilterIds.includes(logMaterialFilter)){
    logMaterialFilter = validFilterIds[0];
  }
  let chips = matsWithLogs.map(m=>{
    const count = data.logs.filter(l=>l.materialId===m.id).length;
    return `<span class="material-chip ${m.id===logMaterialFilter?'active':''}" onclick="selectLogMaterial('${m.id}')">${escapeHtml(m.name)}<span class="cnt">${count}</span></span>`;
  }).join('');
  if(orphanedLogs.length>0){
    chips += `<span class="material-chip ${logMaterialFilter==='__orphaned__'?'active':''}" onclick="selectLogMaterial('__orphaned__')">(삭제된 교재)<span class="cnt">${orphanedLogs.length}</span></span>`;
  }
  const logs = logMaterialFilter==='__orphaned__' ? orphanedLogs : data.logs.filter(l=>l.materialId===logMaterialFilter);
  const sorted = [...logs].sort((a,b)=>b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const listHtml = sorted.map(l=>logItemHtml(l, true)).join('') || `<div class="empty">아직 기록이 없어요.</div>`;
  el.innerHTML = `<div class="material-chip-wrap">${chips}</div>${listHtml}`;
}

function selectLogMaterial(id){
  logMaterialFilter = id;
  renderLogs();
}

function logItemHtml(l, hideMaterialName){
  const m = data.materials.find(x=>x.id===l.materialId);
  const mName = m ? m.name : '(삭제된 교재)';
  let progressTxt;
  if(m && m.trackMode === 'check'){
    progressTxt = '오늘 학습 완료 ✓';
  } else {
    const delta = l.toUnit - l.fromUnit;
    const deltaTxt = delta>0 ? `+${delta}` : `${delta}`;
    progressTxt = `${l.fromUnit} → ${l.toUnit} (${deltaTxt})`;
  }
  const bodyMain = hideMaterialName
    ? progressTxt
    : `<b>${escapeHtml(mName)}</b> · ${progressTxt}`;
  return `
    <div class="log-item">
      <div class="log-date">${formatDate(l.date)}</div>
      <div class="log-body">${bodyMain}</div>
      ${l.note ? `<div class="log-note">${escapeHtml(l.note)}</div>` : ''}
    </div>
  `;
}

function quickLog(materialId){
  const sel = document.getElementById('lMaterial');
  sel.innerHTML = data.materials.map(m=>`<option value="${m.id}" ${m.id===materialId?'selected':''}>${escapeHtml(m.name)}</option>`).join('');
  document.getElementById('lDate').value = localDateStr(new Date());
  document.getElementById('lNote').value='';
  updateLogDefaultUnit();
  openSheet('overlayLog');
}

function editMaterial(materialId){
  const m = data.materials.find(x=>x.id===materialId);
  if(!m) return;
  editingMaterialId = materialId;
  document.getElementById('materialSheetTitle').textContent = '教材編集 · 교재 수정';
  document.getElementById('materialSaveBtn').textContent = '저장';
  document.getElementById('materialDeleteLink').style.display = 'block';
  document.getElementById('mName').value = m.name;
  document.getElementById('mType').value = m.type;
  document.getElementById('mTrackMode').value = m.trackMode || 'progress';
  document.getElementById('mUnitLabel').value = m.unitLabel || '페이지';
  document.getElementById('mTotal').value = m.totalUnits || '';
  document.getElementById('mCurrent').value = m.currentUnit || 0;
  toggleTrackModeFields();
  openSheet('overlayMaterial');
}

function deleteMaterial(){
  if(!editingMaterialId) return;
  if(!confirm('이 교재와 관련된 기록을 모두 삭제할까요? 되돌릴 수 없어요.')) return;
  data.materials = data.materials.filter(x=>x.id!==editingMaterialId);
  data.logs = data.logs.filter(x=>x.materialId!==editingMaterialId);
  editingMaterialId = null;
  closeSheet('overlayMaterial');
  render();
  syncToGitHub();
}

// ---------- 저장 로직 ----------
function saveMaterial(){
  const name = document.getElementById('mName').value.trim();
  const type = document.getElementById('mType').value;
  const trackMode = document.getElementById('mTrackMode').value;

  if(!name){
    alert('이름을 입력해주세요.');
    return;
  }

  let unitLabel = null, total = null, current = 0;
  if(trackMode === 'progress'){
    unitLabel = document.getElementById('mUnitLabel').value.trim() || '페이지';
    total = parseInt(document.getElementById('mTotal').value);
    current = parseInt(document.getElementById('mCurrent').value) || 0;
    if(!total || total<=0){
      alert('전체 분량을 입력해주세요.');
      return;
    }
    current = Math.min(current, total);
  }

  if(editingMaterialId){
    const m = data.materials.find(x=>x.id===editingMaterialId);
    if(m){
      m.name = name;
      m.type = type;
      m.trackMode = trackMode;
      m.unitLabel = unitLabel;
      m.totalUnits = total;
      m.currentUnit = current;
    }
    editingMaterialId = null;
  } else {
    data.materials.push({
      id: 'm_'+Date.now(),
      name, type, trackMode,
      unitLabel, totalUnits: total, currentUnit: current,
      addedDate: localDateStr(new Date())
    });
  }
  closeSheet('overlayMaterial');
  render();
  syncToGitHub();
}

function saveLog(){
  const materialId = document.getElementById('lMaterial').value;
  const date = document.getElementById('lDate').value;
  const note = document.getElementById('lNote').value.trim();
  const m = data.materials.find(x=>x.id===materialId);
  if(!m || !date){
    alert('교재와 날짜를 확인해주세요.');
    return;
  }
  if(m.trackMode === 'check'){
    // 같은 날짜 기록이 이미 있으면 메모만 덮어쓰기
    const existing = data.logs.find(l=>l.materialId===materialId && l.date===date);
    if(existing){
      existing.note = note;
    } else {
      data.logs.push({ id:'l_'+Date.now(), materialId, date, fromUnit:0, toUnit:1, note });
    }
  } else {
    const toUnit = parseInt(document.getElementById('lToUnit').value);
    if(isNaN(toUnit)){
      alert('진도를 입력해주세요.');
      return;
    }
    const fromUnit = m.currentUnit;
    data.logs.push({ id:'l_'+Date.now(), materialId, date, fromUnit, toUnit, note });
    m.currentUnit = Math.max(0, Math.min(toUnit, m.totalUnits));
  }
  closeSheet('overlayLog');
  render();
  syncToGitHub();
}

// ---------- GitHub Contents API 동기화 ----------
function saveSettings(){
  settings = {
    owner: document.getElementById('sOwner').value.trim(),
    repo: document.getElementById('sRepo').value.trim(),
    path: document.getElementById('sPath').value.trim() || 'data.json',
    token: document.getElementById('sToken').value.trim()
  };
  if(!settings.owner || !settings.repo || !settings.token){
    alert('사용자명, 저장소, 토큰을 모두 입력해주세요.');
    return;
  }
  localStorage.setItem('jpStudySettings', JSON.stringify(settings));
  loadFromGitHub();
}

function resetAll(){
  if(confirm('이 기기에 저장된 설정을 모두 지울까요? (원격 데이터는 삭제되지 않습니다)')){
    localStorage.removeItem('jpStudySettings');
    location.reload();
  }
}

function apiUrl(){
  return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${settings.path}`;
}

async function loadFromGitHub(){
  if(!settings) return;
  setSyncStatus('불러오는 중...');
  try{
    const res = await fetch(apiUrl(), {
      headers: { Authorization: `token ${settings.token}` }
    });
    if(res.status===404){
      data = { materials: [], logs: [] };
      sha = null;
      setSyncStatus('새 데이터 파일로 시작합니다.');
      render();
      return;
    }
    if(!res.ok) throw new Error('GitHub 응답 오류: '+res.status);
    const json = await res.json();
    sha = json.sha;
    const decoded = decodeURIComponent(escape(atob(json.content)));
    data = JSON.parse(decoded);
    if(!data.materials) data.materials=[];
    if(!data.logs) data.logs=[];
    setSyncStatus('동기화 완료 ✓');
    closeSheet('overlaySettings');
    render();
  }catch(e){
    console.error(e);
    setSyncStatus('불러오기 실패: '+e.message);
  }
}

async function syncToGitHub(){
  if(!settings){ return; }
  setSyncStatus('저장 중...');
  try{
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = {
      message: `update ${new Date().toISOString()}`,
      content,
    };
    if(sha) body.sha = sha;
    const res = await fetch(apiUrl(), {
      method: 'PUT',
      headers: {
        Authorization: `token ${settings.token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.message || res.status);
    }
    const json = await res.json();
    sha = json.content.sha;
    setSyncStatus('저장 완료 ✓ '+new Date().toLocaleTimeString('ko-KR'));
  }catch(e){
    console.error(e);
    setSyncStatus('저장 실패: '+e.message);
  }
}

function setSyncStatus(msg){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = msg;
}

// ---------- 유틸 ----------
function localDateStr(d){
  const dt = d || new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(d){
  const dt = new Date(d+'T00:00:00');
  return `${dt.getMonth()+1}월 ${dt.getDate()}일`;
}
function daysAgoText(d){
  const diff = Math.floor((new Date().setHours(0,0,0,0) - new Date(d+'T00:00:00').setHours(0,0,0,0)) / 86400000);
  if(diff===0) return '오늘';
  if(diff===1) return '어제';
  return `${diff}일 전`;
}

// ---------- 시작 ----------
if(settings){
  loadFromGitHub();
} else {
  setTimeout(()=>{
    alert('먼저 우측 상단 설정(印) 버튼에서 GitHub 저장소 정보를 입력해주세요.');
    document.getElementById('hankoBtn').click();
  }, 300);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
